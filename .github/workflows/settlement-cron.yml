name: Automated Settlement Worker Cron

on:
  schedule:
    # Runs every 5 minutes (standard GitHub Actions cron resolution)
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Batch size limit of queued orders to disburse'
        required: false
        default: '10'

jobs:
  trigger-settlement-worker:
    name: Run Settlement Worker
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Trigger Supabase Settlement Worker Edge Function
        run: |
          set -e
          SECRET_KEY="${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"
          if [ -z "$SECRET_KEY" ]; then
            echo "::error::Secret SUPABASE_SERVICE_ROLE_KEY is not configured or empty in GitHub Repository Secrets."
            echo "Navigate to Repo Settings -> Secrets and variables -> Actions -> New repository secret and add SUPABASE_SERVICE_ROLE_KEY."
            exit 1
          fi

          # Trim any accidental quotes, carriage returns or whitespace
          CLEAN_KEY=$(echo -n "$SECRET_KEY" | tr -d '\r\n "' | sed "s/^'//;s/'$//")

          KEY_ROLE=$(node -e "try { const p = JSON.parse(Buffer.from(process.env.K.split('.')[1], 'base64').toString()); console.log(p.role || ''); } catch { console.log(''); }" 2>/dev/null env K="$CLEAN_KEY" || true)
          KEY_REF=$(node -e "try { const p = JSON.parse(Buffer.from(process.env.K.split('.')[1], 'base64').toString()); console.log(p.ref || ''); } catch { console.log(''); }" 2>/dev/null env K="$CLEAN_KEY" || true)

          echo "Configured key type: role='$KEY_ROLE', project='$KEY_REF'"

          if [ "$KEY_ROLE" = "anon" ]; then
            echo "::error::You pasted the public 'anon' key in GitHub Secrets instead of the secret 'service_role' key!"
            echo "Please go to Supabase Dashboard -> Project Settings -> API -> Project API keys and copy the 'service_role' (secret) key."
            exit 1
          fi

          if [ -n "$KEY_REF" ] && [ "$KEY_REF" != "kbrfaccrhmvgcdtdfjna" ]; then
            echo "::error::The key belongs to project '$KEY_REF', but this workflow is targeting 'kbrfaccrhmvgcdtdfjna'!"
            exit 1
          fi

          LIMIT="${{ inputs.limit || github.event.inputs.limit || '10' }}"
          echo "Batch limit: $LIMIT"
          echo "Invoking settlement-worker on project kbrfaccrhmvgcdtdfjna..."

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "https://kbrfaccrhmvgcdtdfjna.supabase.co/functions/v1/settlement-worker" \
            -H "Content-Type: application/json" \
            -H "apikey: $CLEAN_KEY" \
            -H "Authorization: Bearer $CLEAN_KEY" \
            -d "{\"limit\": $LIMIT}")

          HTTP_BODY=$(echo "$RESPONSE" | sed '$d')
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)

          echo "Response HTTP Status: $HTTP_CODE"
          echo "Response Body: $HTTP_BODY"

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "Settlement worker executed successfully."
          else
            echo "Settlement worker failed or returned non-2xx status ($HTTP_CODE)."
            exit 1
          fi
